name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install declared test dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify tag matches package version and release notes
        run: node scripts/check-release-tag.mjs
      - name: Full release gates
        run: npm run check:release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="releases/${TAG}.md"
          if [ ! -f "$NOTES" ]; then NOTES="RELEASE-NOTES-${TAG}.md"; fi
          gh release create "$TAG" --title "$TAG" --notes-file "$NOTES" --verify-tag