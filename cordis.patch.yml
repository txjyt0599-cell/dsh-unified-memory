# dsh-unified-memory bundle 层：插入插件行。
# 期1 只占 1 处 systemPrompt.section；期2 加超图后端（默认不建图）。
- insert:
    - id: unified-memory
      name: 'dsh-unified-memory'
      config:
        enabled: true
        emit: 'section'        # section | pre-step
        freezePerSession: true
        injectMaxChars: 8000
        budgetTokens: 450
        order: 0.6
        logs:
          # ⚠️ [2026-10-30] 这里**故意不写 dir**。
          #   原来写的是 '~/.dsh/unified-memory/logs' —— 而 Node 不展开 ~，
          #   它会被当成**相对路径**，在当前工作目录下真的建出一个名叫 "~" 的目录。
          #   不写 ⇒ 走默认 <PM_DATA_ROOT>/logs，跟随 DSH_HOME，换机器自动正确。
          #   确实要自定义再取消下面一行的注释，并写**绝对路径**：
          # dir: '/your/abs/path/logs'
          wakeSampleRate: 1.0
          missSampleRate: 0.2
          maxBytes: 2097152
          keepRotations: 1
        # ── 期2 超图（默认 enabled:false：不建图、不占启动时间）──
        hypergraph:
          enabled: false
          # ⚠️ 同理：indexRoot 也用默认 <PM_DATA_ROOT>/hypergraph，别写 ~
          # indexRoot: '/your/abs/path/hypergraph'
          windowTurns: 8
          gapMs: 1800000
          capCards: 24
          tauUpdate: 0.30
          tauWeak: 0.22
          capEpisodes: 20
          episodesPerShard: 100
          propagation:
            enabled: false      # 代理向量实测 λ=0 最优；真向量待期3 验（见 DESIGN §1.5.12）
            lambda: 0.50

        # ── 期3 三级检索（enabled:false = R0 回滚档，行为等价期2）──
        retrieval:
          enabled: true
          tokenizer: 'bigram'
          aliasEnabled: true
          # ⚠️ 同理：aliasPath 默认 <PM_DATA_ROOT>/alias/engram-triggers.preview.jsonl
          #   文件不存在时 alias 通道自动关闭（不报错、不影响 BM25），所以不用管它。
          # aliasPath: '/your/abs/path/engram-triggers.preview.jsonl'
          wEdge: 0.2
          wAlias: 0.15
          minEpisodeK: 20
          maxNeighbors: 24

        # ═══════════════════════════════════════════════════════════
        #  模型配置 —— 想让它「记得住」，这两段必须填
        # ═══════════════════════════════════════════════════════════
        #
        #  不填会怎样（都不崩，只是静默少功能）：
        #    · llm 缺失       ⇒ 产卡关闭（extract / distill 全跳过）
        #                       ⇒ 结果：能搜，但库一直是空的
        #    · embedding 缺失 ⇒ 向量检索关闭，退回纯 BM25
        #                       ⇒ 结果：能用，但对「换个说法」的召回变弱
        #
        #  两个都是 OpenAI 兼容格式。任选一家供应商填即可。

        # ① 开关（都有默认值，通常不用写）
        #
        #    ⚠️ 优先级不一样，别混：
        #      · fourForcesEnabled  —— 写在这里**优先于**数据目录的 config.json
        #      · enabled / capture / extract / distill / flashbackEnabled /
        #        coldArchive*       —— **只读** config.json，写在这里**不生效**
        #      （写入链走活配置，改了即时生效不用重启；这是有意设计）
        #
        #    默认值：enabled/capture/extract/distill = true，fourForcesEnabled = true
        #            coldArchive* = false（故意：搬卡不可逆）
        #
        #    要改这些开关，请改 $PM_DATA_ROOT/ingest/config.json；
        #    同目录有 CONFIG-NOTES.md 说明每一项。
        # fourForcesEnabled: true

        # ② 产卡用的 LLM（必需，否则不会产生任何记忆卡）
        #    示例：本地 llama.cpp / Ollama、或任意兼容服务
        # llm:
        #   enabled: true
        #   baseUrl: 'http://127.0.0.1:8080/v1'
        #   apiKey: 'not-needed-for-local'
        #   model: 'your-model-name'
        #   maxTokens: 4000
        #   temperature: 0.2
        #   timeoutMs: 60000

        # ③ 向量用的 embedding（可选，不填就纯 BM25）
        #    注意 dimensions 必须与服务端模型实际维度一致
        # embedding:
        #   baseUrl: 'http://127.0.0.1:8080/v1'
        #   apiKey: 'not-needed-for-local'
        #   model: 'bge-m3'
        #   dimensions: 1024

        # ④ 也可以不写在这里，而是让本插件从 DSH profile 继承
        #    （如果你的 profile 里已有 embedding: 段，会自动读取）
        #    ⚠️ 不写 profilePath 才是推荐做法：默认就是 <DSH_HOME>/profiles/web/cordis.patch.yml。
        #       要自定义就写**绝对路径**（'~' 不会被展开，Windows 上写 D:/... 或 C:/...）。
        #    profilePath: 'D:/Users/you/.dsh/profiles/web/cordis.patch.yml'
